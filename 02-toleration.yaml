apiVersion: v1
kind: Pod
metadata:
  name: nginx-tolerated
  labels:
    project: roboshop
    environment: dev
    purpose: poc

spec:
  containers:
  - name: nginx
    image: nginx

  nodeSelector:
    project: roboshop

  tolerations:
  - key: "project"
    operator: "Equal"
    value: "roboshop"
    effect: "NoSchedule"

   

